
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">

  <title>ZEX — Welcome Back</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif'],
          },
          colors: {
            brand: "#ebf21b"
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-zinc-950 text-white antialiased">

  <main class="flex min-h-screen items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">


      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-none bg-brand text-zinc-950 text-2xl font-black shadow-lg shadow-brand/20">
          Z
        </div>

        <h1 class="text-4xl font-extrabold tracking-tighter">
          Welcome to <span class="text-brand">ZEX</span>
        </h1>

        <p class="mt-2 text-sm text-zinc-400">
          Sign in to continue your journey.
        </p>
      </div>


      <section class="rounded-none border border-zinc-800 bg-zinc-900/80 p-6 shadow-2xl sm:p-8">


        <div class="mb-6 grid grid-cols-2 rounded-none bg-zinc-800 p-1">
          <button
            id="loginTab"
            type="button"
            class="rounded-none bg-brand text-zinc-950 px-4 py-2.5 text-sm font-semibold transition"
          >
            Sign In
          </button>

          <button
            id="signupTab"
            type="button"
            class="rounded-none px-4 py-2.5 text-sm font-semibold text-zinc-400 transition hover:text-white"
          >
            Create Account
          </button>
        </div>


        <form id="authForm" class="space-y-5">

          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-zinc-300">
              Email address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
              class="w-full rounded-none border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm outline-none transition placeholder:text-zinc-600 focus:border-brand focus:ring-2 focus:ring-brand/20"
            >
          </div>

          <div>
            <div class="mb-2 flex items-center justify-between">
              <label for="password" class="text-sm font-medium text-zinc-300">
                Password
              </label>

              <button
                id="togglePassword"
                type="button"
                class="text-xs text-brand hover:text-brand/80"
              >
                Show password
              </button>
            </div>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              minlength="6"
              required
              class="w-full rounded-none border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm outline-none transition placeholder:text-zinc-600 focus:border-brand focus:ring-2 focus:ring-brand/20"
            >
          </div>

          <button
            id="submitButton"
            type="submit"
            class="flex w-full items-center justify-center rounded-none bg-brand text-zinc-950 px-4 py-3 font-semibold transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 focus:ring-offset-zinc-900 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Sign In
          </button>

        </form>


        <div class="my-6 flex items-center gap-4">
          <div class="h-px flex-1 bg-zinc-800"></div>
          <span class="text-xs font-semibold uppercase tracking-widest text-zinc-500">
            Or continue with
          </span>
          <div class="h-px flex-1 bg-zinc-800"></div>
        </div>


        <button
          id="googleButton"
          type="button"
          class="flex w-full items-center justify-center gap-3 rounded-none border border-zinc-700 bg-zinc-800/50 px-4 py-3 font-semibold transition hover:border-brand hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-brand"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-2.21 5.16-7.84 5.16-4.84 0-8.76-4.04-8.76-9.04s3.92-9.04 8.76-9.04c2.73 0 4.6 1.17 5.65 2.18l2.59-2.59C19.05 1.62 16.1 0 12.48 0 6.64 0 2 5.64 2 11.48s4.64 11.48 10.48 11.48c6.18 0 10.44-4.3 10.44-10.44 0-.7-.08-1.33-.2-1.93h-10.24z" />
          </svg>
          Continue with Google
        </button>


        <div
          id="message"
          role="status"
          aria-live="polite"
          class="mt-5 hidden rounded-none border px-4 py-3 text-sm"
        ></div>

        <p class="mt-6 text-center text-xs leading-5 text-zinc-500">
          By continuing, you agree to our Terms of Service and Privacy Policy.
        </p>

      </section>

      <p class="mt-6 text-center text-xs text-zinc-600">
        &copy; <span id="year"></span> ZEX. All rights reserved.
      </p>

    </div>

  </main>
 
  <script type="module" src="app.js"></script>
 
  </body>
</html>
